services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: humanize
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: humanize
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U humanize -d humanize']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
