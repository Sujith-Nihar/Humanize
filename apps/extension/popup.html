<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Humanize Review</title>
    <meta name="viewport" content="width=360" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="brand">
        <span class="brand-mark" id="brand-status" aria-hidden="true"></span>
        <span class="brand-text">
          <span class="brand-name">Humanize</span>
          <span class="brand-tagline">Make your writing sound like you.</span>
        </span>
      </header>
      <main id="root" aria-live="polite">Loading…</main>
    </div>
    <!--
      Loads compiled output, not this app's TypeScript sources directly. This MVP does not
      set up a bundler; running `pnpm --filter @humanize/extension build` (or an equivalent
      `tsc` invocation) compiles src/*.ts to dist/src/*.js as native ES modules, which popup.html
      can load directly via relative imports without a bundling step.
    -->
    <script type="module" src="./dist/src/popup.js"></script>
  </body>
</html>
